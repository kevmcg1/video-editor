<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyframe Studio</title>
<meta name="description" content="Motion graphics compositor with layers, keyframes, a graph editor, expressions, effects and 4K 60fps rendering.">
<style>
:root{
  --bg0:#151515; --bg1:#1d1d1d; --bg2:#232323; --bg3:#2b2b2b; --bg4:#333; --line:#0c0c0c; --line2:#3d3d3d;
  --text:#c9c9c9; --dim:#8a8a8a; --faint:#5d5d5d; --blue:#2d8ceb; --blue2:#7ab4ff; --cti:#3b9bff; --good:#59c26d; --bad:#e5534b; --warn:#e6b84a;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg0);color:var(--text);font:11.5px/1.3 var(--font);overflow:hidden;color-scheme:dark;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--bg4);border:1px solid #1a1a1a;border-radius:3px;padding:3px 8px;cursor:pointer}
button:hover{background:#3d3d3d}
button.on{background:#3a5f8f;border-color:#4a7fbf;color:#fff}
button.primary{background:var(--blue);border-color:#1f6fc4;color:#fff}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--bg4)}
button:disabled{opacity:.4;pointer-events:none}
input[type=text],input[type=number],select,textarea{background:#171717;border:1px solid #070707;border-radius:2px;padding:2px 5px;min-width:0;user-select:text;-webkit-user-select:text}
input:focus,select:focus,textarea:focus{outline:1px solid var(--blue)}
input[type=color]{width:30px;height:18px;padding:0;border:1px solid #070707;background:#171717;cursor:pointer}
input[type=range]{accent-color:var(--blue);margin:0}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#444;border:2px solid var(--bg2);border-radius:5px}::-webkit-scrollbar-corner{background:var(--bg2)}
svg.i{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.5;vertical-align:-2px;pointer-events:none}

#app{display:grid;height:100%;min-width:1180px;grid-template-columns:var(--lw,270px) minmax(0,1fr) var(--rw,270px);grid-template-rows:23px 31px minmax(0,1fr) 5px var(--tlh,330px)}
#menubar{grid-column:1/4;display:flex;background:#1a1a1a;border-bottom:1px solid #000;position:relative;z-index:40}
#menubar .m{padding:4px 10px;cursor:default;position:relative}
#menubar .m:hover,#menubar .m.open{background:var(--bg4)}
#menubar .sp{flex:1}
#menubar .brand{padding:4px 12px;color:var(--dim);letter-spacing:.3px}
.dd{position:absolute;top:100%;left:0;min-width:230px;background:#2a2a2a;border:1px solid #000;box-shadow:0 6px 18px #000a;padding:3px 0;z-index:60}
.dd .it{display:flex;justify-content:space-between;gap:24px;padding:4px 14px;cursor:default;white-space:nowrap}
.dd .it:hover{background:var(--blue);color:#fff}
.dd .it.off{opacity:.4;pointer-events:none}
.dd .it kbd{color:var(--dim);font:inherit}.dd .it:hover kbd{color:#dbe9ff}
.dd hr{border:0;border-top:1px solid #3a3a3a;margin:3px 0}
.dd .sub{position:relative}.dd .sub>.dd{left:100%;top:-4px;display:none}.dd .sub:hover>.dd{display:block}
#toolbar{grid-column:1/4;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--bg2);border-bottom:1px solid #000}
#toolbar .tb{width:27px;height:25px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border-color:transparent;color:#bbb;position:relative}
#toolbar .tb:hover{background:var(--bg4)}#toolbar .tb.on{background:#3a5f8f;color:#fff}
#toolbar .sep{width:1px;height:18px;background:#444;margin:0 6px}
#toolbar .lbl{color:var(--dim);margin:0 4px}
#toolbar .sp{flex:1}
.panel{background:var(--bg2);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid #000}
.ptabs{display:flex;background:var(--bg1);flex:none;border-bottom:1px solid #000}
.ptabs button{border:0;border-radius:0;background:transparent;color:var(--dim);padding:5px 10px;border-bottom:2px solid transparent}
.ptabs button.on{color:#fff;background:var(--bg2);border-bottom-color:var(--blue)}
.ptabs .sp{flex:1}
.pbody{flex:1;min-height:0;overflow:auto}
.pad{padding:8px}
.hint{color:var(--dim);font-size:10.5px}

/* project panel */
#left{grid-row:3/4}
.plist .row{display:flex;align-items:center;gap:6px;padding:3px 8px;border-bottom:1px solid #1b1b1b;cursor:default}
.plist .row:hover{background:#2e2e2e}.plist .row.sel{background:#2c4a73;color:#fff}
.plist .row .th{width:34px;height:20px;background:#000 center/cover;border-radius:2px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:9px}
.plist .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .row .meta{color:var(--dim);font-size:10px}
.pfoot{display:flex;gap:4px;padding:4px 6px;background:var(--bg1);border-top:1px solid #000;flex:none}
.fxrow{border-bottom:1px solid #1b1b1b}
.fxrow>.fh{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#262626;font-weight:600}
.fxrow .prow{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;padding:2px 8px 2px 18px}

/* viewer */
#center{grid-row:3/4;display:flex;flex-direction:column;min-width:0;min-height:0}
#ctabs{display:flex;background:var(--bg1);border-bottom:1px solid #000;flex:none}
#ctabs button{border:0;border-radius:0;background:transparent;color:var(--dim);padding:5px 12px;border-right:1px solid #000}
#ctabs button.on{color:#fff;background:var(--bg2);border-bottom:2px solid var(--blue)}
#vwrap{flex:1;min-height:0;position:relative;background:#101010;overflow:hidden}
#stage{position:absolute;box-shadow:0 0 0 1px #000,0 8px 30px #000a}
#stage canvas{display:block;width:100%;height:100%}
#stage.grid{background:conic-gradient(#555 25%,#7a7a7a 0 50%,#555 0 75%,#7a7a7a 0) 0 0/16px 16px}
#ov{position:absolute;inset:0;pointer-events:none}
#vbar{display:flex;align-items:center;gap:10px;padding:3px 8px;background:var(--bg1);border-top:1px solid #000;flex:none;color:var(--dim)}
#vbar select{padding:1px 3px}
#vbar .tcv{color:var(--blue2);font:12px var(--mono)}
#vbar .sp{flex:1}
#vbar .chk{display:flex;align-items:center;gap:4px;cursor:pointer}

/* right column */
#right{grid-row:3/6;grid-column:3}
#right .grp{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid #000}
#infoBody{padding:8px;font-family:var(--mono);font-size:11px;line-height:1.6;min-height:84px}
#infoBody .sw{display:inline-block;width:14px;height:14px;vertical-align:-3px;border:1px solid #000;margin-right:6px}
.prevbar{display:flex;gap:4px;padding:6px 8px;align-items:center;flex-wrap:wrap}
.prevbar button{padding:3px 9px}
.tree .cat{padding:4px 8px;background:#262626;color:var(--dim);cursor:pointer;font-weight:600}
.tree .cat:before{content:"▸ ";}.tree .cat.open:before{content:"▾ "}
.tree .it{padding:3px 8px 3px 22px;cursor:default;display:flex;align-items:center;gap:6px}
.tree .it:hover{background:#2e2e2e}.tree .it.sel{background:#2c4a73;color:#fff}
.tree .it i{width:8px;height:8px;background:var(--blue);display:inline-block;border-radius:2px;flex:none}
.tree .it i.fx{background:#b36ae0}
#chars{padding:8px}
#chars .r{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;margin-bottom:5px}
#chars textarea{width:100%;height:56px;resize:vertical}

/* timeline */
#vsplit{grid-column:1/3;background:#101010;cursor:row-resize}#vsplit:hover{background:var(--blue)}
#tl{grid-column:1/3;grid-row:5;display:grid;grid-template-rows:auto 21px minmax(0,1fr) 20px;grid-template-columns:var(--tlcol,540px) minmax(0,1fr);background:var(--bg2);border:1px solid #000;min-height:0}
#tlhead{grid-column:1;display:flex;flex-direction:column;gap:3px;padding:4px 8px;border-right:1px solid #000;background:var(--bg1)}
#tlhead .big{font:600 20px var(--mono);color:var(--blue2);letter-spacing:.5px;cursor:ns-resize}
#tlhead .sub{display:flex;gap:6px;align-items:center;color:var(--dim)}
#tlhead input[type=text]{width:130px}
#tlbtns{grid-column:2;display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--bg1);justify-content:flex-end}
#tlcols{grid-column:1;display:grid;grid-template-columns:20px 20px 20px 20px 16px 28px 1fr 94px 92px 88px;align-items:center;background:var(--bg1);color:var(--dim);border-right:1px solid #000;border-top:1px solid #000;font-size:10px;padding-right:6px}
#ruler{grid-column:2;position:relative;background:var(--bg1);border-top:1px solid #000;overflow:hidden;cursor:pointer}
#ruler canvas{position:absolute;left:0;top:0}
#cti{position:absolute;top:0;width:11px;height:21px;margin-left:-5px;z-index:4;pointer-events:none}
#cti:before{content:"";position:absolute;left:0;top:0;width:11px;height:13px;background:var(--cti);clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%)}
#tlleft{grid-column:1;grid-row:3;overflow:hidden;border-right:1px solid #000;background:var(--bg2);position:relative}
#tlright{grid-column:2;grid-row:3;overflow:auto;position:relative;background:#1c1c1c}
#tlrows{position:relative}
.lrow{display:grid;grid-template-columns:20px 20px 20px 20px 16px 28px 1fr 94px 92px 88px;align-items:center;height:22px;border-bottom:1px solid #191919;padding-right:6px;background:#2a2a2a}
.lrow.sel{background:#2f4766;color:#fff}
.lrow .c{display:flex;align-items:center;justify-content:center;color:#8c8c8c;height:100%}
.lrow .c:hover{color:#fff}
.lrow .c.on{color:#e8e8e8}
.lrow .lab{width:11px;height:11px;border-radius:2px;margin:auto}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;display:flex;align-items:center;gap:5px}
.lrow .nm .tw{width:12px;cursor:pointer;color:var(--dim);text-align:center}
.lrow select{width:100%;padding:0 2px;font-size:10px;background:#1b1b1b;border-color:#111}
.prow{display:grid;grid-template-columns:1fr auto;align-items:center;height:20px;border-bottom:1px solid #1d1d1d;background:#252525;padding-right:6px}
.prow.grp{background:#292929;color:#d8d8d8}
.prow .l{display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap}
.prow .sw{width:14px;height:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#7e7e7e;flex:none}
.prow .sw.on{color:var(--blue2)}
.prow .kn{display:flex;gap:1px;color:#888;font-size:9px;cursor:pointer;flex:none}
.prow .kn span:hover{color:#fff}
.prow .vals{display:flex;gap:6px;align-items:center;color:var(--blue2);min-width:150px;justify-content:flex-end}
.val{cursor:ew-resize;border-bottom:1px dotted var(--blue2);padding:0 1px;font-family:var(--mono);font-size:11px}
.val:hover{color:#fff}
.vinp{width:56px;height:16px;font-family:var(--mono);font-size:11px;padding:0 3px}
.prow .ex{color:#e6b84a;font-family:var(--mono);font-size:10px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.trow{height:22px;border-bottom:1px solid #191919;position:relative}
.trow.p{height:20px;background:#1f1f1f}.trow.g{background:#212121}
.bar{position:absolute;top:3px;bottom:3px;border-radius:2px;cursor:grab;border:1px solid #0008;overflow:hidden}
.bar.sel{box-shadow:0 0 0 1px #fff8}
.bar .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize}.bar .h.l{left:0}.bar .h.r{right:0}
.bar .bn{position:absolute;left:8px;top:0;right:4px;font-size:10px;color:#fff;text-shadow:0 1px 1px #000;white-space:nowrap;overflow:hidden;line-height:15px;pointer-events:none}
.kfd{position:absolute;top:4px;width:11px;height:11px;margin-left:-5.5px;background:#bdbdbd;z-index:3;cursor:pointer}
.kfd.lin{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.kfd.ease{clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%,40% 50%)}
.kfd.hold{clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,0 100%)}
.kfd.sel{background:#4aa0ff}
.kfd:hover{background:#fff}
#playline{position:absolute;top:0;bottom:0;width:1px;background:var(--cti);z-index:5;pointer-events:none}
#waBar{position:absolute;top:0;height:5px;background:#4a8fe2aa;cursor:ew-resize;z-index:3;border-radius:1px}
#waRange{position:absolute;top:0;bottom:0;background:#ffffff08;pointer-events:none}
#cacheBar{position:absolute;bottom:0;height:3px;background:#59c26d;pointer-events:none}
#tlfoot{grid-column:1/3;display:flex;align-items:center;gap:10px;background:var(--bg1);border-top:1px solid #000;padding:0 8px;color:var(--dim)}
#tlfoot input[type=range]{width:160px}
#graph{position:absolute;inset:0;background:#1a1a1a;display:none}
#graph canvas{position:absolute;inset:0}
#marq{position:absolute;border:1px solid var(--blue);background:#2d8ceb22;display:none;z-index:7;pointer-events:none}

/* dialogs */
#modalroot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0009;z-index:100}
#modalroot.on{display:flex}
.modal{background:var(--bg2);border:1px solid #000;box-shadow:0 20px 60px #000c;width:min(640px,94vw);max-height:92vh;display:flex;flex-direction:column;border-radius:4px}
.modal>header{padding:8px 12px;border-bottom:1px solid #000;background:var(--bg1);font-weight:600;display:flex;align-items:center}
.modal>header button{margin-left:auto}
.modal>.mb{padding:12px;overflow:auto}
.modal>footer{padding:8px 12px;border-top:1px solid #000;background:var(--bg1);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.fgrid{display:grid;grid-template-columns:120px 1fr;gap:7px 10px;align-items:center}
.fgrid label{color:var(--dim)}.fgrid select,.fgrid input[type=text]{width:100%}
.presets{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.presets button.hot{border-color:#e08a3b;background:#4a3118;color:#fff}
.summary{margin-top:10px;padding:8px 10px;background:#171717;border:1px solid #000;border-radius:3px;font-family:var(--mono);font-size:11px;line-height:1.7}
.prog{height:10px;background:#111;border:1px solid #000;border-radius:5px;overflow:hidden;margin:10px 0 6px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#7ab4ff)}
.warnbox{margin-top:8px;padding:6px 9px;border-radius:3px;background:#3a2a12;border:1px solid #7a5a1c;color:#ffd9a0;font-size:11px}
.errbox{margin-top:8px;padding:6px 9px;border-radius:3px;background:#3a1514;border:1px solid #8a2a26;color:#ffb4ae;font-size:11px}
#toasts{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:200;pointer-events:none;align-items:center}
.toast{background:#303030;border:1px solid #000;border-radius:4px;padding:6px 14px;box-shadow:0 6px 24px #000a}.toast.err{border-color:var(--bad)}
.ctx{position:fixed;background:#2a2a2a;border:1px solid #000;box-shadow:0 6px 18px #000a;padding:3px 0;z-index:80;min-width:170px}
.ctx .it{padding:4px 14px;cursor:default}.ctx .it:hover{background:var(--blue);color:#fff}
#dropveil{position:fixed;inset:0;background:#2d8ceb33;border:3px dashed var(--blue);display:none;align-items:center;justify-content:center;font-size:22px;font-weight:700;z-index:90;pointer-events:none}#dropveil.on{display:flex}
</style>
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="toolbar"></div>

  <div id="left" class="panel">
    <div class="ptabs" id="ltabs"><button data-t="project" class="on">Project</button><button data-t="fxc">Effect Controls</button></div>
    <div class="pbody" id="lbody"></div>
    <div class="pfoot" id="lfoot"></div>
  </div>

  <div id="center" class="panel">
    <div id="ctabs"></div>
    <div id="vwrap"><div id="stage" class="grid"><canvas id="view"></canvas></div><canvas id="ov"></canvas></div>
    <div id="vbar">
      <label>Zoom <select id="zoomSel"></select></label>
      <label>Resolution <select id="resSel"><option value="auto">Auto</option><option value="1">Full</option><option value=".5">Half</option><option value=".333">Third</option><option value=".25">Quarter</option></select></label>
      <label class="chk"><input type="checkbox" id="chkGrid" checked> Transparency</label>
      <label class="chk"><input type="checkbox" id="chkSafe"> Safe margins</label>
      <span class="sp"></span><span class="tcv" id="vtc">0:00:00:00</span>
    </div>
  </div>

  <div id="right" class="panel">
    <div class="grp"><div class="ptabs"><button class="on">Info</button><button id="prevTabBtn">Preview</button></div>
      <div id="infoBody"></div>
      <div class="prevbar" id="prevbar"></div></div>
    <div class="grp" style="flex:1;min-height:120px"><div class="ptabs"><button class="on">Effects &amp; Presets</button></div>
      <div style="padding:5px 6px;border-bottom:1px solid #000"><input type="text" id="fxSearch" placeholder="Search effects & presets" style="width:100%" spellcheck="false"></div>
      <div class="pbody tree" id="fxTree"></div></div>
    <div class="grp"><div class="ptabs"><button class="on">Character</button></div><div id="chars"></div></div>
  </div>

  <div id="vsplit"></div>

  <div id="tl">
    <div id="tlhead"><div class="big" id="tlTime" title="Drag to scrub · click to enter a frame">0:00:00:00</div><div class="sub"><span id="tlFrames">0000 (30.00 fps)</span></div>
      <div class="sub"><input type="text" id="layerSearch" placeholder="Search layers" spellcheck="false"></div></div>
    <div id="tlbtns">
      <button id="bMotion" class="ghost" title="Toggle graph editor (Shift+F3)">Graph Editor</button>
      <button id="bEase" class="ghost" title="Easy Ease selected keyframes (F9)">Easy Ease</button>
      <button id="bLin" class="ghost" title="Linear keyframes">Linear</button>
      <button id="bHold" class="ghost" title="Hold keyframes">Hold</button>
      <button id="bRam" class="primary" title="RAM Preview (0)">RAM Preview</button>
    </div>
    <div id="tlcols"><span></span><span></span><span></span><span></span><span></span><span>#</span><span>Layer Name</span><span>Mode</span><span>TrkMat</span><span>Parent &amp; Link</span></div>
    <div id="ruler"><canvas id="rulercv"></canvas><div id="waBar"></div><div id="cacheBar"></div><div id="cti"></div></div>
    <div id="tlleft"><div id="lrows"></div></div>
    <div id="tlright"><div id="tlrows"><div id="waRange"></div><div id="playline"></div><div id="marq"></div></div><div id="graph"><canvas id="graphcv"></canvas></div></div>
    <div id="tlfoot"><span>Time zoom</span><input type="range" id="tzoom" min="0" max="100" value="40"><button id="bFitTl" class="ghost">Fit</button><span id="tlmsg"></span></div>
  </div>
</div>
<div id="modalroot"></div><div id="toasts"></div><div id="dropveil">Drop footage to import</div>
